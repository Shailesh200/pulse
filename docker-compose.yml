# Local / emergency. Production is Coolify → New Resource → Umami
# on the CardOrbit VPS, public URL https://pulse.shaileshjha.in
services:
  umami:
    image: ghcr.io/umami-software/umami:3.0.3
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgres://umami:${POSTGRES_PASSWORD}@db:5432/umami
      DATABASE_TYPE: postgres
      APP_SECRET: ${APP_SECRET}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:3000/api/heartbeat']
      interval: 5s
      timeout: 20s
      retries: 10
  db:
    image: postgres:16-alpine
    volumes:
      - postgresql-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: umami
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U umami -d umami']
      interval: 5s
      timeout: 20s
      retries: 10

volumes:
  postgresql-data:
